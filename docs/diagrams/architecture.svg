<svg viewBox="0 0 1300 640" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .bg        { fill: #050506; }
      .card      { fill: #0b0c10; stroke: rgba(233,228,218,0.16); stroke-width: 1; }
      .card-root { stroke: rgba(233,228,218,0.4); }
      .title     { fill: #e9e4da; font-family: 'Fraunces', 'Cormorant Garamond', serif; font-style: italic; font-weight: 400; font-size: 16px; }
      .sub       { fill: #6d727b; font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.03em; }
      .edge      { stroke: rgba(233,228,218,0.28); stroke-width: 1.2; fill: none; }
      .edge-acc  { stroke: #3c4b46; stroke-width: 1.4; }
      .kicker    { fill: #6d727b; font-family: 'JetBrains Mono', monospace; font-size: 9.5px; letter-spacing: 0.22em; text-transform: uppercase; }
      .dot       { fill: #e9e4da; fill-opacity: 0.8; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1300" height="640" />

  <g opacity="0.5">
    <circle cx="650" cy="310" r="300" stroke="#e9e4da" stroke-opacity="0.05" fill="none"/>
    <circle cx="650" cy="310" r="205" stroke="#e9e4da" stroke-opacity="0.045" fill="none"/>
    <circle cx="650" cy="310" r="115" stroke="#e9e4da" stroke-opacity="0.04" fill="none"/>
  </g>

  <text class="kicker" x="30" y="34">Component &amp; Route Architecture</text>

  <!-- Root -->
  <rect class="card card-root" x="568" y="54" width="164" height="54" rx="3" />
  <text class="title" x="650" y="78" text-anchor="middle">main.tsx</text>
  <text class="sub" x="650" y="96" text-anchor="middle">BrowserRouter root</text>

  <rect class="card card-root" x="568" y="140" width="164" height="54" rx="3" />
  <text class="title" x="650" y="164" text-anchor="middle">App.tsx</text>
  <text class="sub" x="650" y="182" text-anchor="middle">Route table, lazy per route</text>

  <!-- main.tsx -> App.tsx : straight vertical, 90 deg -->
  <line class="edge" x1="650" y1="108" x2="650" y2="140" />
  <circle class="dot" cx="650" cy="124" r="2" />

  <!-- Tier 2: top-level routes (7 cards, centers evenly spaced) -->
  <!-- centers: 116, 294, 472, 650, 828, 1006, 1184 -->
  <!-- Orthogonal fan-out: single vertical drop, one horizontal bus, then
       verticals into each card. Every segment is purely horizontal or
       vertical, so nothing meets a neighbor at a stray angle. -->
  <line class="edge" x1="650" y1="194" x2="650" y2="216" />
  <line class="edge" x1="116" y1="216" x2="1184" y2="216" />
  <line class="edge" x1="116" y1="216" x2="116" y2="248" />
  <line class="edge" x1="294" y1="216" x2="294" y2="248" />
  <line class="edge" x1="472" y1="216" x2="472" y2="248" />
  <line class="edge" x1="650" y1="216" x2="650" y2="248" />
  <line class="edge" x1="828" y1="216" x2="828" y2="248" />
  <line class="edge" x1="1006" y1="216" x2="1006" y2="248" />
  <line class="edge edge-acc" x1="1184" y1="216" x2="1184" y2="248" />
  <circle class="dot" cx="650" cy="216" r="2" />

  <rect class="card" x="40" y="248" width="152" height="52" rx="3" />
  <text class="title" x="116" y="271" text-anchor="middle">Home</text>
  <text class="sub" x="116" y="288" text-anchor="middle">/</text>

  <rect class="card" x="218" y="248" width="152" height="52" rx="3" />
  <text class="title" x="294" y="271" text-anchor="middle">Portfolio</text>
  <text class="sub" x="294" y="288" text-anchor="middle">/portfolio</text>

  <rect class="card" x="396" y="248" width="152" height="52" rx="3" />
  <text class="title" x="472" y="271" text-anchor="middle">Contact</text>
  <text class="sub" x="472" y="288" text-anchor="middle">/contact</text>

  <rect class="card" x="574" y="248" width="152" height="52" rx="3" />
  <text class="title" x="650" y="271" text-anchor="middle">Branding</text>
  <text class="sub" x="650" y="288" text-anchor="middle">/branding</text>

  <rect class="card" x="752" y="248" width="152" height="52" rx="3" />
  <text class="title" x="828" y="271" text-anchor="middle">Descent</text>
  <text class="sub" x="828" y="288" text-anchor="middle">/descent</text>

  <rect class="card" x="930" y="248" width="152" height="52" rx="3" />
  <text class="title" x="1006" y="271" text-anchor="middle">Journey</text>
  <text class="sub" x="1006" y="288" text-anchor="middle">/journey/*</text>

  <rect class="card" x="1108" y="248" width="152" height="52" rx="3" />
  <text class="title" x="1184" y="271" text-anchor="middle">NotFound</text>
  <text class="sub" x="1184" y="288" text-anchor="middle">*</text>

  <!-- Tier 3: Home -> ParticleField -->
  <!-- Home/Portfolio columns sit only 178px apart, too tight for two
       full-width cards side by side, so ParticleField's connector jogs
       left with a clean 90-degree elbow instead of shrinking the card
       until its own label overflows it. -->
  <line class="edge" x1="116" y1="300" x2="116" y2="318" />
  <line class="edge" x1="116" y1="318" x2="100" y2="318" />
  <line class="edge" x1="100" y1="318" x2="100" y2="336" />
  <circle class="dot" cx="116" cy="318" r="2" />
  <rect class="card" x="25" y="336" width="150" height="44" rx="3" />
  <text class="title" x="100" y="358" text-anchor="middle" font-size="14">ParticleField</text>
  <text class="sub" x="100" y="373" text-anchor="middle">Canvas particle engine</text>

  <!-- Tier 3: Portfolio -> ProjectGrid, Portfolio -> VideoModal -->
  <!-- Orthogonal elbow: drop, short bus, drop - no diagonals -->
  <line class="edge" x1="294" y1="300" x2="294" y2="316" />
  <line class="edge" x1="280" y1="316" x2="470" y2="316" />
  <line class="edge" x1="280" y1="316" x2="280" y2="336" />
  <line class="edge" x1="470" y1="316" x2="470" y2="336" />
  <circle class="dot" cx="294" cy="316" r="2" />

  <rect class="card" x="205" y="336" width="150" height="44" rx="3" />
  <text class="title" x="280" y="358" text-anchor="middle" font-size="14">ProjectGrid</text>
  <text class="sub" x="280" y="373" text-anchor="middle">Section + card layout</text>

  <rect class="card" x="395" y="336" width="150" height="44" rx="3" />
  <text class="title" x="470" y="358" text-anchor="middle" font-size="14">VideoModal</text>
  <text class="sub" x="470" y="373" text-anchor="middle">Full screen lightbox</text>

  <!-- Tier 4: ProjectGrid -> ProjectCard, straight vertical directly
       beneath its parent, with extra clearance so it has room to breathe -->
  <line class="edge" x1="280" y1="380" x2="280" y2="430" />

  <rect class="card" x="205" y="430" width="150" height="44" rx="3" />
  <text class="title" x="280" y="452" text-anchor="middle" font-size="14">ProjectCard</text>
  <text class="sub" x="280" y="467" text-anchor="middle">Link out or video open</text>

  <!-- Tier 3: Journey -> nested layout routes (straight vertical) -->
  <line class="edge" x1="1006" y1="300" x2="1006" y2="336" />
  <rect class="card" x="900" y="336" width="212" height="64" rx="3" />
  <text class="title" x="1006" y="358" text-anchor="middle" font-size="13">JourneyLayout</text>
  <text class="sub" x="1006" y="374" text-anchor="middle">index, roadmap,</text>
  <text class="sub" x="1006" y="388" text-anchor="middle">cheatsheets, cheatsheets/:slug</text>

  <line x1="30" y1="600" x2="60" y2="600" class="edge-acc" />
  <text class="sub" x="68" y="604">Wildcard, catch all route</text>
</svg>
